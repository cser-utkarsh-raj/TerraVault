name: Maintenance Diagnostics

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostics-${{ github.repository }}
  cancel-in-progress: false

jobs:
  diagnostics:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.name != 'Maintenance Diagnostics' &&
       github.event.workflow_run.head_branch == 'deployment-ready' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          ref: deployment-ready
          persist-credentials: false
      - name: Initialize diagnostic report
        run: |
          printf 'Repository: %s\nBranch: deployment-ready\nEvent: %s\n' "${{ github.repository }}" "${{ github.event_name }}" > maintenance-summary.txt
          : > upstream-failure.log
      - name: Capture failed workflow logs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          printf 'Failed workflow: %s\nRun: %s\n' "$RUN_NAME" "$RUN_URL" >> maintenance-summary.txt
          gh run view "$RUN_ID" --log-failed > upstream-failure.log 2>&1 || true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # setup-python v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Flask application-factory smoke test
        env:
          SECRET_KEY: ci_secret_key_placeholder
          DATABASE_URL: 'sqlite:///:memory:'
          FLASK_ENV: testing
        run: python -c "from app import create_app; app = create_app('testing'); print('Flask app factory loaded successfully')"
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # upload-artifact v4
        with:
          name: terravault-maintenance-diagnostics-${{ github.run_id }}
          path: |
            maintenance-summary.txt
            upstream-failure.log
          if-no-files-found: warn
